# One-time OpenBubbles activation on GENUINE PHYSICAL Mac hardware.
#
# GitHub-HOSTED macOS runners are Apple Virtualization.framework VMs: they report
# model "VirtualMac2,1" and board "Mac-20000000". Apple flags those identifiers, so
# the hosted route is abandoned. This workflow runs on a self-hosted runner instead:
# register the real Mac under Settings > Actions > Runners (see the guide, step B2).
#
# Two guards refuse to produce a code from virtual hardware: a hw.model pre-check
# before the app is even downloaded, and a payload check before the code is printed.
name: openbubbles-activate

on:
  workflow_dispatch:

jobs:
  activate:
    runs-on: self-hosted
    timeout-minutes: 25

    steps:
      - name: Confirm the runner is a real Mac
        run: |
          set -euo pipefail
          MODEL=$(sysctl -n hw.model)
          BOARD=$(ioreg -rd1 -c IOPlatformExpertDevice | awk -F'"' '/board-id/{print $4; exit}')
          echo "runner model: $MODEL"
          echo "runner board: $BOARD"
          case "$MODEL" in
            VirtualMac*|VMware*|Parallels*|QEMU*|KVM*)
              echo "::error::Runner reports '$MODEL', a virtual machine. Refusing to generate a code - Apple flags virtual hardware identifiers."
              exit 1
              ;;
          esac
          case "$BOARD" in
            *20000000*)
              echo "::error::Runner board-id is '$BOARD', a virtual placeholder. Refusing to generate a code."
              exit 1
              ;;
          esac

      - name: Download the generator
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          curl -fSL -o "$WORK/generator.zip" \
            "https://github.com/OpenBubbles/Mac-Hardware-Info/releases/latest/download/Mac.Hardware.Info.zip"
          unzip -o -q "$WORK/generator.zip" -d "$WORK/app"
          find "$WORK/app" -maxdepth 3 -print
          APP=$(find "$WORK/app" -maxdepth 3 -name "*.app" -print -quit)
          if [ -z "$APP" ]; then
            echo "::error::No .app found in the released zip."
            exit 1
          fi
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Allow the unsigned app to run
        run: |
          xattr -dr com.apple.quarantine "$APP" || true
          codesign --force --deep --sign - "$APP" || true
          softwareupdate --install-rosetta --agree-to-license || true

      - name: Launch the generator
        run: |
          open "$APP"
          sleep 20
          pgrep -lf "Mac Hardware Info" || echo "::warning::app process not found by name"

      - name: Capture the activation code
        run: |
          set -uo pipefail
          mkdir -p "$WORK/out"

          # Path 1 (primary) - click "Copy Activation Code" and read the pasteboard.
          # This produced the byte-exact payload; the payload never reaches a file
          # inside the app, so the pasteboard is the only lossless channel.
          osascript -e 'tell application "System Events" to tell process "Mac Hardware Info" to click button "Copy Activation Code" of window 1' || true
          sleep 3
          pbpaste > "$WORK/out/clipboard.txt" 2>/dev/null || true

          # Path 2 (fallback) - screenshot the QR and decode binary-safe.
          # -Sbinary stops zbar from UTF-8 munging the protobuf bytes (which turned
          # 0xEC into C3 AC and broke the length prefix in the hosted run).
          screencapture -x "$WORK/out/screen.png" || true
          if command -v zbarimg >/dev/null 2>&1; then
            zbarimg -q -Sbinary --raw "$WORK/out/screen.png" > "$WORK/out/qr.bin" 2>/dev/null || true
            if [ -s "$WORK/out/qr.bin" ]; then
              base64 -i "$WORK/out/qr.bin" > "$WORK/out/code-from-qr.txt"
            fi
          else
            echo "::notice::zbarimg not installed (brew install zbar) - using the clipboard capture only."
          fi

          # Guard: never let virtual-machine identifiers through, encoded or decoded.
          # "VirtualMac" and "Mac-2000000" as they appear base64-encoded after the 6-byte OABS header.
          for f in "$WORK/out/clipboard.txt" "$WORK/out/code-from-qr.txt"; do
            [ -s "$f" ] || continue
            if grep -Eq 'VmlydHVhbE1hYw|TWFjLTIwMDAwMDAw' "$f"; then
              echo "::error::$f contains virtual-machine identifiers (VirtualMac / Mac-20000000). Not usable - do not submit this to Apple."
              exit 1
            fi
          done

          # Fail loudly instead of quietly "succeeding" with nothing captured.
          if [ ! -s "$WORK/out/clipboard.txt" ] && [ ! -s "$WORK/out/code-from-qr.txt" ]; then
            echo "::error::No activation code captured. Grant the runner Accessibility permission (System Events click) and Screen Recording (screenshot) in System Settings > Privacy & Security, then re-run."
            exit 1
          fi

          echo "===== activation code ====="
          head -c 1000 "$WORK/out/clipboard.txt" 2>/dev/null || true
          echo
          echo "===== decoded identifiers ====="
          if command -v base64 >/dev/null 2>&1; then
            base64 -D -i "$WORK/out/clipboard.txt" 2>/dev/null | strings -n 4 || \
              base64 -d "$WORK/out/clipboard.txt" 2>/dev/null | strings -n 4 || true
          fi
          echo
          echo "Expected: a real model such as Macmini9,1 / MacBookPro18,x and a normal serial."

      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activation
          path: ${{ env.WORK }}/out/
          if-no-files-found: warn

      - name: Close the app and clean up
        if: always()
        run: |
          pkill -x "Mac Hardware Info" || true
          [ -n "${WORK:-}" ] && rm -rf "$WORK" || true
